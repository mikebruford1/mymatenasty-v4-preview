<!doctype html>
<html lang="en" data-theme="ink">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="My Mate Nasty — Premium social photo platform" />
<meta name="theme-color" content="#0b0c0e" />
<title>My Mate Nasty</title>
<style>:root {
  --bg: #0b0c0e;
  --bg-elevated: #0f1114;
  --surface: #131519;
  --surface-2: #181b20;
  --surface-3: #20242a;
  --text: #f3f0e9;
  --text-soft: #d7d3ca;
  --muted: #969ba4;
  --muted-2: #6f747d;
  --line: rgba(244, 240, 232, .10);
  --line-strong: rgba(244, 240, 232, .18);
  --accent: #7f9eff;
  --accent-strong: #6386ff;
  --mint: #c9b99d;
  --coral: #d9b99b;
  --danger: #ef7777;
  --success: #8fd0aa;
  --overlay: rgba(4, 5, 7, .78);
  --shadow: 0 24px 80px rgba(0, 0, 0, .38);
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 15px;
  --radius-sm: 11px;
  --content: 1180px;
  --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-editorial: Georgia, "Times New Roman", serif;
}

html[data-theme="slate"] {
  --bg: #101318;
  --bg-elevated: #141820;
  --surface: #191e27;
  --surface-2: #202631;
  --surface-3: #29313d;
  --text: #f1f4f8;
  --text-soft: #d7dce4;
  --muted: #9ba4b2;
  --accent: #89a9ff;
  --mint: #a8d9d0;
  --coral: #eea6a2;
}

html[data-theme="warm"] {
  --bg: #100e0d;
  --bg-elevated: #151210;
  --surface: #1b1714;
  --surface-2: #241f1b;
  --surface-3: #2d2722;
  --text: #f6efe4;
  --text-soft: #ddd2c4;
  --muted: #a49789;
  --accent: #9daaff;
  --mint: #bfd5bd;
  --coral: #efa294;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  color: var(--text);
  background: var(--bg);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
::selection { background: rgba(127,158,255,.35); }

.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.container { width: min(var(--content), calc(100% - 40px)); margin-inline: auto; }
.page-shell { min-height: 100vh; }

/* Brand */
.brand { display: inline-flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  width: 48px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
  position: relative; color: var(--text); font-family: var(--font-editorial); line-height: 1;
  isolation: isolate; flex: 0 0 auto;
}
.brand-mark i { position: relative; display: block; font-style: normal; font-weight: 500; font-size: 27px; letter-spacing: -.12em; }
.brand-mark i:nth-child(1) { transform: translateX(8px); z-index: 1; }
.brand-mark i:nth-child(2) { transform: translateX(0); z-index: 2; color: #e9ddc8; }
.brand-mark i:nth-child(3) { transform: translateX(-8px); z-index: 3; }
.brand-mark::after { content:""; position:absolute; left:4px; right:4px; bottom:1px; height:1px; background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:.65; }
.brand-name { display:grid; line-height:1.05; min-width:0; }
.brand-name strong { font-size: 15px; letter-spacing: -.03em; white-space:nowrap; }
.brand-name span { color:var(--muted); font-size:9px; margin-top:4px; letter-spacing:.09em; text-transform:uppercase; white-space:nowrap; }
.brand-name strong { font-family:var(--font-editorial); font-weight:500; font-size:17px; letter-spacing:-.02em; }
.brand-name span { color:#b5aa99; }

.brand.compact .brand-name { display:none; }
.brand.compact .brand-mark { width:42px; height:32px; }
.brand.compact .brand-mark i { font-size:22px; }

/* Buttons and fields */
.btn { border:1px solid var(--line); border-radius:999px; min-height:42px; padding:0 18px; display:inline-flex; align-items:center; justify-content:center; gap:9px; background:transparent; color:var(--text); font-weight:650; font-size:13px; transition:transform .18s ease, border-color .18s ease, background .18s ease, color .18s ease; }
.btn:hover { transform:translateY(-1px); border-color:var(--line-strong); }
.btn:active { transform:translateY(0); }
.btn-primary { border-color:transparent; background:var(--text); color:var(--bg); }
.btn-primary:hover { background:var(--text-soft); }
.btn-accent { border-color:transparent; background:var(--accent); color:#0a1022; }
.btn-subtle { background:rgba(255,255,255,.035); }
.btn-danger { border-color:rgba(239,119,119,.28); color:#ffaaaa; }
.btn-icon { width:42px; padding:0; border-radius:50%; }
.btn-sm { min-height:34px; padding:0 13px; font-size:11px; }
.btn-lg { min-height:50px; padding:0 22px; font-size:14px; }
.icon { width:19px; height:19px; flex:0 0 auto; }
.icon-sm { width:16px; height:16px; }

.field { display:grid; gap:8px; }
.field label { color:var(--text-soft); font-size:12px; font-weight:650; }
.input, .textarea, .select {
  width:100%; border:1px solid var(--line); border-radius:13px; background:var(--surface);
  color:var(--text); padding:13px 14px; outline:none; transition:border-color .18s ease, box-shadow .18s ease;
}
.input:focus, .textarea:focus, .select:focus { border-color:rgba(127,158,255,.7); box-shadow:0 0 0 3px rgba(127,158,255,.11); }
.textarea { min-height:112px; resize:vertical; }
.field-help { color:var(--muted); font-size:10px; line-height:1.5; }
.form-grid { display:grid; gap:16px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

/* Public site */
.public-nav { height:78px; display:flex; align-items:center; justify-content:space-between; position:relative; z-index:5; }
.public-nav-links { display:flex; align-items:center; gap:8px; }
.public-nav-links a { color:var(--muted); font-size:12px; padding:10px 12px; }
.public-nav-links a:hover { color:var(--text); }
.hero { min-height:calc(100vh - 78px); display:grid; grid-template-columns:minmax(0,.9fr) minmax(520px,1.1fr); gap:62px; align-items:center; padding:52px 0 88px; }
.eyebrow { display:inline-flex; align-items:center; gap:9px; color:var(--mint); font-size:11px; font-weight:750; letter-spacing:.12em; text-transform:uppercase; }
.eyebrow::before { content:""; width:24px; height:1px; background:currentColor; }
.hero h1 { margin:22px 0 24px; font-size:clamp(58px,7.2vw,104px); line-height:.86; letter-spacing:-.075em; font-weight:760; max-width:720px; }
.hero h1 em { display:block; font-family:var(--font-editorial); font-weight:400; letter-spacing:-.055em; color:#dfc6a6; }
.hero-copy > p { color:var(--muted); max-width:580px; font-size:16px; line-height:1.75; }
.hero-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:30px; }
.hero-notes { display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:32px; color:var(--muted); font-size:11px; }
.hero-notes span::before { content:"•"; color:var(--accent); margin-right:8px; }

.editorial-preview { position:relative; min-width:0; }
.preview-frame { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-xl); box-shadow:var(--shadow); overflow:hidden; }
.preview-top { height:62px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; border-bottom:1px solid var(--line); }
.preview-top .search-pill { width:45%; height:34px; border:1px solid var(--line); border-radius:999px; display:flex; align-items:center; color:var(--muted-2); padding:0 13px; font-size:9px; }
.preview-layout { display:grid; grid-template-columns:145px 1fr 160px; min-height:530px; }
.preview-sidebar { border-right:1px solid var(--line); padding:16px 11px; }
.preview-sidebar .mini-brand { display:flex; align-items:center; gap:7px; font-weight:750; font-size:9px; margin:3px 5px 18px; }
.preview-nav-item { display:flex; align-items:center; gap:8px; color:var(--muted); padding:9px 10px; border-radius:9px; font-size:8px; }
.preview-nav-item.active { color:var(--text); background:var(--surface-3); }
.preview-feed { padding:18px; min-width:0; }
.preview-feed-title { display:flex; justify-content:space-between; align-items:end; margin-bottom:13px; }
.preview-feed-title h3 { margin:3px 0 0; font-size:21px; letter-spacing:-.045em; }
.preview-feed-title span { color:var(--muted); font-size:7px; }
.demo-post { border:1px solid var(--line); border-radius:15px; overflow:hidden; background:var(--bg-elevated); }
.demo-post-head { display:flex; align-items:center; gap:8px; padding:10px; }
.demo-post-head img { width:27px; height:27px; border-radius:50%; }
.demo-post-head div { display:grid; gap:2px; }
.demo-post-head strong { font-size:8px; }
.demo-post-head small { font-size:6px; color:var(--muted); }
.demo-post-head b { margin-left:auto; color:var(--muted); font-size:8px; }
.demo-post > img { width:100%; aspect-ratio:16/9; object-fit:cover; }
.demo-post-actions { display:flex; gap:12px; padding:9px 11px; color:var(--text-soft); font-size:8px; }
.demo-post-actions span:last-child { margin-left:auto; }
.demo-post-caption { font-size:7px; color:var(--muted); padding:0 11px 11px; line-height:1.5; }
.preview-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.preview-tile { background:var(--bg-elevated); border:1px solid var(--line); border-radius:13px; padding:7px; }
.preview-tile img { aspect-ratio:4/3; object-fit:cover; border-radius:9px; }
.preview-tile strong { display:block; font-size:7px; margin:7px 2px 2px; }
.preview-tile span { color:var(--muted); font-size:6px; margin-left:2px; }
.preview-rail { border-left:1px solid var(--line); padding:15px 11px; }
.mini-panel { border:1px solid var(--line); border-radius:13px; padding:11px; margin-bottom:10px; background:rgba(255,255,255,.02); }
.mini-panel label { display:block; color:var(--muted); font-size:7px; margin-bottom:9px; }
.mini-avatars { display:flex; }
.mini-avatars img { width:25px; height:25px; border-radius:50%; border:2px solid var(--surface); margin-left:-6px; }
.mini-avatars img:first-child { margin-left:0; }
.mini-invite { background:var(--mint); color:#132019; }
.mini-invite strong { font-size:11px; line-height:1.2; display:block; }
.mini-invite p { font-size:7px; line-height:1.5; opacity:.74; }
.mini-invite button { border:0; border-radius:999px; background:#16211b; color:#f5f3ed; padding:7px 11px; font-size:7px; }
.phone-preview { position:absolute; width:196px; right:-50px; bottom:-64px; border:7px solid #262a31; background:var(--bg); border-radius:33px; overflow:hidden; box-shadow:0 25px 70px rgba(0,0,0,.52); }
.phone-status { display:flex; justify-content:space-between; padding:11px 13px 5px; font-size:7px; }
.phone-brand { display:flex; align-items:center; gap:7px; padding:8px 11px; font-size:9px; font-weight:750; }
.story-row { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; padding:3px 9px 10px; }
.story-item { text-align:center; color:var(--muted); font-size:5px; }
.story-item img { width:30px; height:30px; object-fit:cover; border-radius:50%; padding:2px; border:1.5px solid var(--coral); margin:0 auto 3px; }
.phone-post > img { width:100%; aspect-ratio:4/5; object-fit:cover; }
.phone-bottom { height:45px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-around; color:var(--muted); font-size:13px; }
.phone-bottom .plus { width:31px; height:31px; display:grid; place-items:center; border-radius:50%; background:var(--text); color:var(--bg); }

.public-section { padding:110px 0; }
.section-header { display:grid; grid-template-columns:1fr 1fr; gap:50px; align-items:end; margin-bottom:42px; }
.section-header h2 { margin:14px 0 0; font-size:clamp(42px,5vw,70px); line-height:.98; letter-spacing:-.06em; }
.section-header h2 em { font-family:var(--font-editorial); color:var(--accent); font-weight:400; }
.section-header p { color:var(--muted); line-height:1.75; max-width:500px; }
.feature-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.feature-card { min-height:250px; border:1px solid var(--line); border-radius:var(--radius-lg); padding:23px; background:linear-gradient(180deg,rgba(255,255,255,.025),transparent); }
.feature-index { color:var(--muted-2); font-family:var(--font-editorial); font-style:italic; }
.feature-card h3 { margin:86px 0 10px; font-size:18px; letter-spacing:-.03em; }
.feature-card p { color:var(--muted); line-height:1.65; font-size:12px; }
.public-cta { margin-bottom:76px; padding:50px; border-radius:var(--radius-xl); background:var(--text); color:var(--bg); display:flex; justify-content:space-between; align-items:end; gap:30px; }
.public-cta h2 { margin:0; font-size:clamp(42px,5vw,72px); line-height:.9; letter-spacing:-.065em; }
.public-cta h2 em { font-family:var(--font-editorial); font-weight:400; color:#516fd0; }
.public-cta .btn { border-color:rgba(11,12,14,.2); color:var(--bg); }
.public-footer { border-top:1px solid var(--line); padding:28px 0 36px; display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:10px; }

/* Auth */
.auth-page { min-height:100vh; display:grid; grid-template-columns:minmax(0,.9fr) minmax(520px,1.1fr); }
.auth-aside { padding:38px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--line); background:var(--surface); }
.auth-aside h1 { margin:50px 0 18px; max-width:560px; font-size:clamp(48px,6vw,86px); line-height:.88; letter-spacing:-.07em; }
.auth-aside h1 em { font-family:var(--font-editorial); font-weight:400; color:var(--coral); }
.auth-aside p { color:var(--muted); max-width:530px; line-height:1.7; }
.auth-art { border-radius:var(--radius-xl); overflow:hidden; min-height:270px; background:url('assets/rooftop.svg') center/cover; position:relative; }
.auth-art::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.8)); }
.auth-quote { position:absolute; z-index:1; left:25px; right:25px; bottom:23px; font-family:var(--font-editorial); font-style:italic; font-size:23px; }
.auth-main { display:grid; place-items:center; padding:40px; }
.auth-card { width:min(450px,100%); }
.auth-card h2 { font-size:37px; letter-spacing:-.05em; margin:0 0 8px; }
.auth-card > p { color:var(--muted); line-height:1.6; margin:0 0 27px; }
.auth-card .btn { width:100%; }
.auth-switch { text-align:center; color:var(--muted); font-size:12px; margin-top:20px; }
.auth-switch button { border:0; background:none; color:var(--text); font-weight:750; }
.terms-note { color:var(--muted-2); font-size:9px; line-height:1.55; text-align:center; margin-top:15px; }

/* App shell */
.app-shell { min-height:100vh; display:grid; grid-template-columns:230px minmax(0,1fr); }
.app-sidebar { position:sticky; top:0; height:100vh; border-right:1px solid var(--line); padding:25px 18px; display:flex; flex-direction:column; background:var(--bg); z-index:15; }
.app-sidebar .brand { margin:0 7px 32px; }
.app-nav { display:grid; gap:5px; }
.nav-link { width:100%; border:0; background:none; color:var(--muted); border-radius:12px; min-height:44px; padding:0 12px; display:flex; align-items:center; gap:12px; text-align:left; font-size:12px; font-weight:620; }
.nav-link:hover { background:rgba(255,255,255,.035); color:var(--text); }
.nav-link.active { background:var(--surface-2); color:var(--text); }
.nav-link .nav-count { margin-left:auto; min-width:22px; height:20px; display:grid; place-items:center; padding:0 6px; background:var(--coral); color:#23100d; border-radius:999px; font-size:9px; }
.sidebar-create { margin:22px 0; width:100%; }
.sidebar-user { margin-top:auto; border-top:1px solid var(--line); padding-top:16px; display:flex; align-items:center; gap:10px; }
.avatar { width:38px; height:38px; border-radius:50%; object-fit:cover; background:var(--surface-3); }
.sidebar-user div { display:grid; min-width:0; gap:3px; }
.sidebar-user strong { font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar-user span { color:var(--muted); font-size:9px; }
.sidebar-user button { margin-left:auto; }
.app-main { min-width:0; }
.app-header { position:sticky; top:0; z-index:12; height:72px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 28px; border-bottom:1px solid var(--line); background:rgba(11,12,14,.88); backdrop-filter:blur(20px); }
.app-header-title { display:grid; gap:2px; }
.app-header-title strong { font-size:16px; letter-spacing:-.03em; }
.app-header-title span { color:var(--muted); font-size:9px; }
.header-actions { display:flex; align-items:center; gap:8px; }
.search-box { width:min(340px,35vw); height:39px; border:1px solid var(--line); border-radius:999px; background:var(--surface); display:flex; align-items:center; gap:9px; padding:0 14px; color:var(--muted); font-size:11px; }
.search-box input { border:0; outline:0; background:transparent; color:var(--text); width:100%; }
.app-content { width:min(980px,calc(100% - 50px)); margin:0 auto; padding:30px 0 80px; }
.feed-layout { display:grid; grid-template-columns:minmax(0,650px) minmax(230px,1fr); gap:24px; align-items:start; }
.feed-column { min-width:0; display:grid; gap:18px; }
.feed-intro { display:flex; justify-content:space-between; align-items:end; gap:20px; padding:5px 2px 7px; }
.feed-intro h1 { margin:0; font-size:34px; letter-spacing:-.055em; }
.feed-intro p { color:var(--muted); margin:7px 0 0; font-size:11px; }
.feed-filter { border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--muted); padding:9px 13px; font-size:10px; }
.post-card { border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--surface); overflow:hidden; }
.post-header { display:flex; align-items:center; gap:11px; padding:15px 16px; }
.post-author { display:grid; gap:3px; min-width:0; }
.post-author strong { font-size:12px; }
.post-author span { color:var(--muted); font-size:9px; }
.post-menu { margin-left:auto; }
.post-caption { padding:0 17px 14px; color:var(--text-soft); font-size:12px; line-height:1.6; }
.post-location { color:var(--mint); font-size:9px; display:inline-flex; align-items:center; gap:5px; margin-top:7px; }
.post-media { position:relative; background:var(--surface-2); }
.post-media img { width:100%; max-height:720px; object-fit:cover; }
.media-count { position:absolute; right:12px; top:12px; background:rgba(5,6,8,.72); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:6px 9px; color:white; font-size:9px; }
.media-dots { position:absolute; left:50%; bottom:13px; transform:translateX(-50%); display:flex; gap:5px; }
.media-dots i { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.42); }
.media-dots i.active { width:15px; border-radius:999px; background:white; }
.post-toolbar { display:flex; align-items:center; gap:3px; padding:11px 12px 7px; }
.action-btn { border:0; background:none; color:var(--muted); min-height:38px; padding:0 8px; border-radius:9px; display:flex; align-items:center; gap:7px; font-size:10px; }
.action-btn:hover { background:var(--surface-2); color:var(--text); }
.action-btn.liked { color:var(--coral); }
.action-btn.save { margin-left:auto; }
.post-summary { padding:0 17px 15px; }
.post-summary > strong { font-size:10px; }
.post-summary p { margin:8px 0 0; color:var(--muted); font-size:10px; line-height:1.5; }
.post-summary button { border:0; background:none; color:var(--muted); padding:0; font-size:10px; margin-top:9px; }
.feed-rail { position:sticky; top:96px; display:grid; gap:14px; }
.rail-card { border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--surface); padding:17px; }
.rail-card h3 { margin:0 0 14px; font-size:12px; letter-spacing:-.02em; }
.rail-card > p { color:var(--muted); font-size:10px; line-height:1.55; }
.people-list { display:grid; gap:12px; }
.person-row { display:flex; align-items:center; gap:9px; }
.person-row img { width:34px; height:34px; border-radius:50%; }
.person-row div { display:grid; gap:2px; min-width:0; }
.person-row strong { font-size:10px; }
.person-row span { color:var(--muted); font-size:8px; }
.person-row .btn { margin-left:auto; }
.invite-rail { background:var(--mint); color:#142018; border:0; }
.invite-rail h3 { font-family:var(--font-editorial); font-style:italic; font-weight:400; font-size:24px; }
.invite-rail p { color:rgba(20,32,24,.7); }
.invite-rail .btn { border-color:rgba(20,32,24,.18); color:#142018; }

/* Profile */
.profile-hero { border-bottom:1px solid var(--line); padding:36px 0 30px; }
.profile-head { display:grid; grid-template-columns:auto 1fr auto; gap:20px; align-items:center; }

  function renderAuth(mode) {
    const signup = mode === "signup";
    document.title = `${signup ? "Create account" : "Sign in"} — My Mate Nasty`;
    return `<main class="auth-page"><aside class="auth-aside">${brand()}<div><h1>${signup ? "Join the feed." : "Back to the"}<br><em>${signup ? "Bring the photos." : "good stuff."}</em></h1><p>${signup ? "Create a profile, upload photos of your mates and join one shared community feed." : "Sign in to view the latest uploads, comments and photos from the community."}</p></div><div class="auth-art"><div class="auth-quote">“A good photo deserves a questionable comment section.”</div></div></aside><section class="auth-main"><div class="auth-card"><button class="btn btn-subtle btn-sm" data-route="landing" style="margin-bottom:28px">← Back</button><h2>${signup ? "Create account" : "Welcome back"}</h2><p>${signup ? "Anyone can join. Your email stays private." : "Enter your details to open the shared feed."}</p>
      <form id="auth-form" class="form-grid">
        ${signup ? `<div class="form-row"><div class="field"><label>Display name</label><input class="input" name="displayName" required placeholder="Michael Bruford"></div><div class="field"><label>Username</label><input class="input" name="username" required minlength="3" placeholder="michaelb"></div></div>` : ""}
        <div class="field"><label>Email address</label><input class="input" type="email" name="email" required placeholder="you@example.com"></div>
        <div class="field"><label>Password</label><input class="input" type="password" name="password" required minlength="8" placeholder="At least 8 characters"><span class="field-help">Use at least eight characters. Passwords will be handled securely by Supabase in the live build.</span></div>
        ${signup ? `<div class="field"><label>About you <span style="color:var(--muted);font-weight:400">(optional)</span></label><textarea class="textarea" name="bio" maxlength="180" placeholder="One or two sentences about you."></textarea></div>` : ""}
        <button class="btn btn-primary btn-lg" type="submit">${signup ? "Create account" : "Sign in"}</button>
      </form><div class="auth-switch">${signup ? "Already have an account?" : "New here?"} <button data-route="${signup ? "login" : "signup"}">${signup ? "Sign in" : "Create account"}</button></div>${signup ? `<p class="terms-note">By creating an account, you agree not to upload photographs you do not have permission to share.</p>` : ""}</div></section></main>`;
  }

  function appHeader(title, subtitle="") {
    return `<header class="app-header"><div class="app-header-title"><strong>${title}</strong><span>${subtitle}</span></div><div class="search-box">${icons.search}<input placeholder="Search people or captions" aria-label="Search"></div><div class="header-actions"><button class="btn btn-icon" data-action="open-invite" aria-label="Invite a mate">${icons.share}</button><button class="btn btn-icon" data-route="notifications" aria-label="Notifications">${icons.bell}</button><button class="btn btn-accent btn-sm" data-action="open-create">${icons.plus} Post</button></div></header>`;

  function mobileTabs() {
    const tabs = [["feed",icons.home],["search",icons.search],["create",icons.plus],["notifications",icons.bell],["profile",icons.user]];
    return `<nav class="mobile-tabbar">${tabs.map(([r,i])=>`<button class="mobile-tab ${r==='create'?'create':''} ${state.route===r?'active':''}" ${r==='create'?'data-action="open-create"':`data-route="${r}"`}>${i}</button>`).join('')}</nav>`;
  }

  function postCard(post) {
    const dots = post.images.length > 1 ? `<span class="media-count">1 / ${post.images.length}</span><div class="media-dots">${post.images.map((_,i)=>`<i class="${i===0?'active':''}"></i>`).join('')}</div>` : "";
    return `<article class="post-card" data-post-id="${post.id}"><div class="post-header"><img class="avatar" src="${post.avatar}" alt="${post.author}"><div class="post-author"><strong>${post.author}</strong><span>@${post.username} · ${post.time}</span></div><button class="btn btn-icon btn-sm post-menu" aria-label="Post options">${icons.more}</button></div><div class="post-caption">${post.caption}${post.location?`<span class="post-location">${icons.pin}${post.location}</span>`:""}</div><div class="post-media"><img src="${post.images[0]}" alt="Photo posted by ${post.author}">${dots}</div><div class="post-toolbar"><button class="action-btn ${post.liked?'liked':''}" data-action="like" data-id="${post.id}">${icons.heart}<span>${post.likes}</span></button>${post.commentsEnabled?`<button class="action-btn" data-action="comments" data-id="${post.id}">${icons.comment}<span>${post.comments.length}</span></button>`:""}<button class="action-btn save">${icons.bookmark}</button></div><div class="post-summary"><strong>${post.likes} likes</strong>${post.commentsEnabled ? (post.comments.length?`<p><strong>${post.comments[0].author}</strong> ${post.comments[0].body}</p><button data-action="comments" data-id="${post.id}">View ${post.comments.length===1?'comment':`all ${post.comments.length} comments`}</button>`:`<button data-action="comments" data-id="${post.id}">Be the first to comment</button>`) : `<p>Comments are switched off for this post.</p>`}</div></article>`;
  }

  function feedPage() {
    return `${appHeader("Shared feed","Newest photos from everyone")}
      <div class="app-content"><div class="feed-layout"><section class="feed-column"><div class="feed-intro"><div><h1>Latest</h1><p>One feed. No followers. Newest first.</p></div><button class="feed-filter">Newest first ▾</button></div>${state.posts.map(postCard).join('')}</section><aside class="feed-rail"><div class="rail-card"><h3>New people</h3><div class="people-list">${people.map(p=>`<div class="person-row"><img src="${p.avatar}" alt=""><div><strong>${p.name}</strong><span>@${p.user}</span></div><button class="btn btn-sm">View</button></div>`).join('')}</div></div><div class="rail-card invite-rail"><h3>Got a mate missing from the comments?</h3><p>Share your personal invite link. They can create an account in under a minute.</p><button class="btn btn-sm" data-action="open-invite">Invite a mate</button></div></aside></div></div>`;
  }

    return `${appHeader("Search","Find people and posts")}<div class="app-content simple-page"><div class="simple-heading"><div><h1>Search</h1><p>Search usernames, names, locations and captions.</p></div></div><div class="field"><label class="sr-only">Search</label><input class="input" style="min-height:52px" placeholder="Try ‘Brighton’, ‘Jess’ or ‘weekend’"></div><div style="height:18px"></div><div class="rail-card"><h3>People</h3><div class="people-list">${people.map(p=>`<div class="person-row"><img src="${p.avatar}"><div><strong>${p.name}</strong><span>@${p.user}</span></div><button class="btn btn-sm">View profile</button></div>`).join('')}</div></div></div>`;
  }

  function settingsPage() {
    return `${appHeader("Settings","Profile, appearance and privacy")}<div class="app-content simple-page"><div class="simple-heading"><div><h1>Settings</h1><p>Control how your account and the platform behave.</p></div></div><div class="settings-layout"><nav class="settings-menu">${[['appearance','Appearance'],['profile','Profile'],['privacy','Privacy'],['account','Account']].map(([id,l])=>`<button class="settings-tab ${state.selectedSettings===id?'active':''}" data-settings-tab="${id}">${l}</button>`).join('')}</nav><section class="settings-panel">${settingsPanel()}</section></div></div>`;
  }

  function settingsPanel() {
    if (state.selectedSettings === "appearance") return `<h2>Appearance</h2><p>The design system supports multiple restrained dark palettes without changing the layout.</p><div class="theme-grid">${[['ink','Ink','Neutral, editorial'],['slate','Slate','Cooler and cleaner'],['warm','Warm','Softer, more cinematic']].map(([id,n,d])=>`<button class="theme-card ${state.theme===id?'active':''}" data-theme-choice="${id}"><span class="theme-swatch ${id}"></span><strong>${n}</strong><span>${d}</span></button>`).join('')}</div>`;
    if (state.selectedSettings === "profile") return `<h2>Profile</h2><p>Update the information shown alongside your posts.</p><div class="form-grid"><div class="form-row"><div class="field"><label>Display name</label><input class="input" value="Michael Bruford"></div><div class="field"><label>Username</label><input class="input" value="michaelb"></div></div><div class="field"><label>About you</label><textarea class="textarea">Usually the one taking the photo. Occasionally the reason it should not be uploaded.</textarea></div><div><button class="btn btn-primary" data-action="save-settings">Save profile</button></div></div>`;
    if (state.selectedSettings === "privacy") return `<h2>Privacy</h2><p>Your email address is private. Your profile and uploads are visible to signed-in members.</p><div class="toggle-row"><div><strong>Remove image metadata</strong><span>Strip location and device data from uploads.</span></div><button class="switch on" data-action="toggle-switch"><i></i></button></div><div class="toggle-row"><div><strong>Allow profile search</strong><span>Let other members find you by name or username.</span></div><button class="switch on" data-action="toggle-switch"><i></i></button></div><div class="toggle-row"><div><strong>Activity notifications</strong><span>Notify you when someone likes or comments.</span></div><button class="switch on" data-action="toggle-switch"><i></i></button></div>`;
    return `<h2>Account</h2><p>Manage account security and access.</p><div class="toggle-row"><div><strong>Email address</strong><span>michael.bruford@example.com</span></div><button class="btn btn-sm">Change</button></div><div class="toggle-row"><div><strong>Password</strong><span>Last changed recently</span></div><button class="btn btn-sm">Reset</button></div><div style="margin-top:22px"><button class="btn btn-danger" data-action="delete-account">Delete account</button></div>`;
  }

  function renderApp() {
    let page = feedPage();
    if (state.route === "profile") page = profilePage();
    if (state.route === "notifications") page = notificationsPage();
    if (state.route === "search") page = searchPage();
    if (state.route === "settings") page = settingsPage();
    document.title = `${state.route[0].toUpperCase()+state.route.slice(1)} — My Mate Nasty`;
    return `<div class="app-shell">${sidebar()}<main class="app-main">${page}</main>${mobileTabs()}</div>`;
  }

  function render() {
    document.documentElement.dataset.theme = state.theme;
    if (!state.loggedIn && ["feed","profile","notifications","search","settings"].includes(state.route)) state.route="landing";
    if (state.route === "landing") app.innerHTML = renderLanding();
    else if (state.route === "login" || state.route === "signup") app.innerHTML = renderAuth(state.route);
    else app.innerHTML = renderApp();
    window.scrollTo(0,0);
  }

  function showToast(message) {
    toast.textContent = message; toast.classList.add("show"); clearTimeout(window.__mmnToast); window.__mmnToast=setTimeout(()=>toast.classList.remove("show"),2600);
  }

  function navigate(route) {
    state.route=route; history.replaceState(null,"",`#${route}`); render();

  }

  function renderUploadPreviews() {
    const box=document.getElementById("upload-previews"); if(!box)return; box.innerHTML=state.uploaded.map((src,i)=>`<div class="upload-preview"><img src="${src}"><button data-action="remove-upload" data-index="${i}">×</button></div>`).join('');

  function openComments(id) {
    const post=state.posts.find(p=>p.id===id); if(!post)return;
    overlayRoot.innerHTML=`<div class="drawer-overlay" data-action="close-overlay"><aside class="drawer" data-stop><header class="drawer-header"><h2>Comments</h2><button class="btn btn-icon btn-sm" data-action="close-overlay">${icons.close}</button></header><div class="comments-list">${post.comments.length?post.comments.map(c=>`<div class="comment"><img src="${c.avatar}"><div><div class="comment-body"><strong>${c.author}</strong>${c.body}</div><div class="comment-meta"><span>${c.time}</span><span>Like</span><span>Reply</span></div></div></div>`).join(''):`<div class="empty-state"><h3>No comments yet</h3><p>Be the first to say something sensible.</p></div>`}</div><form class="comment-compose" data-comment-post="${id}"><input class="input" name="comment" placeholder="Add a comment…" required><button class="btn btn-primary btn-sm">Post</button></form></aside></div>`;

  }

  function openInvite() {
    overlayRoot.innerHTML=`<div class="overlay" data-action="close-overlay"><section class="modal" style="max-width:520px" data-stop><header class="modal-header"><h2>Invite a mate</h2><button class="btn btn-icon btn-sm" data-action="close-overlay">${icons.close}</button></header><div class="modal-body"><span class="eyebrow">Open registration</span><h2 style="font-size:34px;letter-spacing:-.05em;margin:17px 0 10px">Send the link.<br>Let them explain themselves.</h2><p style="color:var(--muted);font-size:11px;line-height:1.65">Anyone can create an account. Your personal link simply makes it easier to invite them and can track who joined from you later.</p><div class="invite-link"><code>https://mymatenasty.com/join?ref=michaelb</code><button class="btn btn-sm" data-action="copy-invite">Copy</button></div><div class="invite-options"><button class="invite-option" data-action="copy-invite">${icons.share}<strong>Copy link</strong><span>Paste it anywhere.</span></button><button class="invite-option" data-action="share-email">${icons.mail}<strong>Email</strong><span>Open your email app.</span></button></div></div></section></div>`;

    if(e.target.id==="auth-form"){
      e.preventDefault(); const wasSignup = state.route === "signup"; state.loggedIn=true; navigate("feed"); showToast(wasSignup?"Account created in preview mode":"Signed in to preview mode");
    }
    if(e.target.matches("[data-comment-post]")){
      e.preventDefault(); const id=e.target.dataset.commentPost; const input=e.target.elements.comment; const p=state.posts.find(x=>x.id===id); if(p&&input.value.trim()){p.comments.push({author:"Michael Bruford",avatar:"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22a%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%2343c6f5%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23214a66%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22url(%23a)%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2239%22%20r%3D%2220%22%20fill%3D%22%23f3c9aa%22%2F%3E%3Cpath%20d%3D%22M18%20100q5-38%2032-38t32%2038%22%20fill%3D%22%23101725%22%2F%3E%3Cpath%20d%3D%22M29%2035q3-28%2023-26%2019%202%2020%2028-9-14-22-14-12%200-21%2012%22%20fill%3D%22%23111622%22%2F%3E%3C%2Fsvg%3E",body:input.value.trim(),time:"Now"});openComments(id);showToast("Comment added");}
    }
  });

  document.addEventListener("click", e=>{
    const tab=e.target.closest("[data-settings-tab]"); if(tab){state.selectedSettings=tab.dataset.settingsTab;render();}
    const theme=e.target.closest("[data-theme-choice]"); if(theme){state.theme=theme.dataset.themeChoice;try { localStorage.setItem("mmn-theme",state.theme); } catch (_) {}render();showToast(`${theme.querySelector('strong').textContent} theme selected`);}
  });

  const hash=location.hash.replace('#','');
  if(["login","signup"].includes(hash)) state.route=hash;
  render();
})();
</script>
